server.port=8080

# Disable Spring Security's auto-generated password (we set our own in SecurityConfig)
spring.security.user.name=unused

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# Pretty-print JSON responses so they're easier to read in Postman / browser
spring.jackson.serialization.indent-output=true

# Show full error details (useful while learning — turn off in production)
server.error.include-message=always
server.error.include-binding-errors=always

# File upload size limits (Section 15)
# max-file-size  — limit per individual file
# max-request-size — limit for the entire multipart request (all files combined)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
